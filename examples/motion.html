<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaderfield example: motion helpers</title>
<style>
  html, body { margin: 0; background: #09090b; color: #f2f2f4; font-family: Helvetica, Arial, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 64px 24px 160px; display: flex; flex-direction: column; gap: 56px; }
  .label { font: 12px ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #a4a6b0; margin-bottom: 16px; }
  .stage { position: relative; height: 260px; border-radius: 12px; background: #111114; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .big { font-size: 64px; font-weight: 500; letter-spacing: -0.045em; }
  button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 13px; border: 1px solid rgba(242,242,244,0.3); margin-top: 12px; display: inline-block; }
  .story { font-size: 30px; line-height: 1.3; letter-spacing: -0.02em; }
</style>
</head>
<body>
<main>
  <div>
    <div class="label">typeIn · decode</div>
    <div class="stage"><div class="big" id="type">Shaderfield</div></div>
    <button id="replayType">Replay</button>
  </div>

  <div>
    <div class="label">countUp + tick + bars</div>
    <div class="stage" style="flex-direction:column;gap:20px">
      <div class="big" id="count">€0.00</div>
      <div style="display:flex;gap:12px;align-items:center"><span id="tick"></span><span>Payroll approved</span></div>
      <div id="bars" style="width:320px"></div>
    </div>
    <button id="replayData">Replay</button>
  </div>

  <div>
    <div class="label">curtain</div>
    <div class="stage" id="curtain" style="cursor:pointer"><div class="big" id="scene">Scene 01</div></div>
    <button id="runCurtain">Run transition</button>
  </div>

  <div>
    <div class="label">revealWords (scroll)</div>
    <p class="story" id="story">Every shader runs *live* in the browser, follows the *cursor* and renders straight to *video*.</p>
  </div>

  <div style="height:40vh"></div>
</main>

<script src="../shaderfield.js"></script>
<script>
  const M = Shaderfield.motion;
  const $ = (id) => document.getElementById(id);

  const type = () => M.typeIn($("type"), { mode: "decode", accent: ["#22d3ee", "#f43f5e"] });
  type(); $("replayType").onclick = type;

  const data = () => {
    M.countUp($("count"), { to: 4212.5, decimals: 2, prefix: "€" });
    M.tick($("tick"), { color: "#34d399", delay: 0.8 });
    M.bars($("bars"), { values: [1, 1, 1, 0.6], color: "#a78bfa" });
  };
  data(); $("replayData").onclick = data;

  let n = 1;
  const run = () => M.curtain($("curtain"), {
    color: "#3b82f6", cols: 22,
    onSwap: () => { n = n === 1 ? 2 : 1; $("scene").textContent = "Scene 0" + n; }
  });
  $("runCurtain").onclick = run; $("curtain").onclick = run;

  M.revealWords($("story"), { accent: "#f2f2f4", dim: 0.18 });
</script>
</body>
</html>
